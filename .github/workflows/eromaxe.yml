name: eromax Update IPTV Playlist

on:
  workflow_dispatch: # Manuel olarak da tetiklenebilir
  schedule:
    - cron: '0 */2 * * *' # Her 2 saatte bir otomatik çalışır (Cloudflare worker ile senkronize)

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub'a dosya geri yazabilmek için yazma izni

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium

      - name: Run scraper script
        run: |
          python scrape_channels.py

      - name: Commit and push changes if playlist updated
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add playlist.m3u
          git diff --staged --quiet || git commit -m "Auto-update playlist.m3u via Python script [skip ci]"
          git push
