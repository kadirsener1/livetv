name: tv247 tr Link güncelle

on:
  workflow_dispatch: # Manuel çalıştırmak için
  schedule:
    - cron: '0 */2 * * *'  # Her 2 saatte bir otomatik çalışır (00:00, 02:00, 04:00, ...)

# Depoya yazma (push) izni vermek için gerekli izinler
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # 1. Proje kodlarını çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python ortamını kur
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Bağımlılıkları yükle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Tarayıcıyı kur
      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      # 5. Scraper'ı çalıştır (tv247tr.m3u ve tv247tr/*.m3u8 dosyalarını oluşturur)
      - name: Run Scraper
        run: |
          python tv247tr.py
         

      # 6. Oluşan dosyaları depoya (Commit & Push) yükle
      - name: Commit and Push changes
        run: |
          # Git kullanıcı bilgilerini ayarla
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Hem ana playlist dosyasını hem de livetv klasörünü ekle
          git add tv247tr.m3u tv247tr/
          
          # Değişiklik kontrolü yap ve commit et
          if git diff --cached --quiet; then
            echo "Herhangi bir değişiklik yok, push edilmeyecek."
          else
            git commit -m "Playlist ve LiveTV kanalları güncellendi [skip ci]"
            git push
          fi
