name: Otomatik Bilgi Videosu Guncelleme

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # GitHub panelinden manuel olarak çalıştırabilmek için

jobs:
  update-video:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kutukhaneleri Yukle
        run: |
          pip install opencv-python pillow requests

      - name: Python Betigini Calistir
        run: |
          python update_video.py

      - name: Degisiklikleri GitHub'a Otomatik Kaydet
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add bilgi.mp4 bilgi.m3u8
          git commit -m "Otomatik bilgi videosu ve m3u8 guncellendi [skip ci]" || exit 0
          git push
