name: Atom M3U Güncelleyici

permissions:
  contents: write   # Repository'ye yazma/push izni

on:
schedule:
    - cron: '0 */3 * * *'  # Her 2 saatte bir otomatik çalışır
    workflow_dispatch:       # Manuel çalıştırma butonu

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Çakışmaları önlemek için tüm git geçmişini çeker

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scripti Çalıştır (atom.py)
        run: python atom.py

      - name: Değişiklikleri Kaydet ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Python kodunda OUTPUT_FILE = "tv247tr.m3u" olduğu için bu dosya eklenir
          git add tv247tr.m3u
          
          # Eğer linklerde değişiklik varsa commit atar, yoksa adımı pas geçer
          if git diff --staged --quiet; then
            echo "Değişiklik yok, push işlemi yapılmayacak."
          else
            git commit -m "Auto-update tv247tr.m3u [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
