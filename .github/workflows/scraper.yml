name: Stream Link Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'  # Her 30 dakikada bir otomatik çalışır

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          python scraper.py

      # Oluşturulan .m3u dosyasını GitHub arayüzünden indirilebilir hale getirir
      - name: Upload M3U Playlist as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-streams-playlist
          path: playlist.m3u
          retention-days: 2  # Dosya 2 gün boyunca indirilebilir kalır
