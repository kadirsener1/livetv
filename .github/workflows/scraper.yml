name: Stream Link Scraper

# Çalışma Tetikleyicileri
on:
  # 1. GitHub arayüzünden manuel olarak tetiklemek için:
  workflow_dispatch:

  # 2. Belirli aralıklarla otomatik çalıştırmak için (Örn: Her 30 dakikada bir):
  schedule:
    - cron: '*/30 * * * *'

  # 3. Koda her 'push' yapıldığında tetiklemek isterseniz:
  push:
    branches:
      - main

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      # Proje kodlarını çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python ortamını kur
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # Gerekli bağımlılıkları yükle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwright ve Chromium tarayıcı bağımlılıklarını kur
      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      # Python scriptini çalıştır
      - name: Run Scraper
        run: |
          python scraper.py
