name: Otomatik Playlist Güncelleyici

on:
  schedule:
    # Her gün Türkiye saati ile sabah 06:00'da çalışır (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch: # Manuel olarak da tetiklenebilir

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Scripti Çalıştır
        run: |
          python update.py  # Python dosyanızın adı neyse buraya yazın

      - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tv247tr.m3u
          git diff --staged --quiet || (git commit -m "Otomatik M3U playlist güncellemesi" && git push)
