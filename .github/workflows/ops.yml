name: Opstream Yayınlarını Güncelle

on:
  schedule:
    # Her 4 saatte bir otomatik çalışır (İsteğe göre değiştirebilirsiniz)
    - cron: '0 */4 * * *'
  workflow_dispatch: # İstediğiniz an GitHub üzerinden tek tıkla çalıştırma butonu
  push:
    branches:
      - main # main branch'e kod gönderildiğinde de test için çalışır

# Repoya dosya yazıp pushlayabilmesi için gerekli izinler
permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📁 Repoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: 🌐 Playwright Chromium ve Sistem Bağımlılıklarını Kur
        run: |
          python -m playwright install --with-deps chromium

      - name: 🚀 Python Scriptini Çalıştır
        run: |
          # Python dosyanızın adı 'main.py' değilse burayı güncelleyin:
          python main.py

      - name: 💾 Değişiklikleri Repoya Kaydet (Git Commit & Push)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Çıktı klasörünü ve debug dosyasını takibe al
          git add opstream_output/ debug_failed.json

          # Sadece değişiklik varsa commit at
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atılmayacak."
          else
            git commit -m "Auto Update: Yayın linkleri güncellendi [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
