name: Update Stream Links

on:
  schedule:
    # Her 4 saatte bir otomatik güncelleme yapar
    - cron: '0 */4 * * *'
  workflow_dispatch: # Manuel çalıştırma butonunu aktif eder

permissions:
  contents: write

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Playwright Tarayıcılarını Kur
        run: |
          playwright install chromium --with-deps

      - name: Tarayıcıyı Test Et ve Çalıştır
        run: |
          # Python dosyanızın adı 'main.py' değilse aşağıdaki ismi güncelleyin.
          python main.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "Herhangi bir değişiklik yok."
          else
            git commit -m "Automated stream playlist update [skip ci]"
            git push
          fi
