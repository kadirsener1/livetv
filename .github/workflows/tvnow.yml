name: Tvnow playlist

on:
  workflow_dispatch: # Sadece dışarıdan gelen (Cloudflare / Manuel) tetiklemeleri kabul eder

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Scraper Script
        run: python tvnow.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add test.m3u domain_cache.txt
          git diff --staged --quiet || git commit -m "Auto-update tv247tr playlist and domain cache [skip ci]"
          git push
