name: Yayin M3U Guncelleyici

on:
  schedule:
    # Her gün saat 06:00 UTC'de otomatik çalışır (CRON)
    - cron: '0 6 * * *'
  # GitHub panelinden "Run workflow" butonu ile manuel çalıştırma imkanı sağlar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Bagimliliklari Yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Yayini Bul ve M3U Olustur
        run: |
          python scraper.py

      - name: Degisiklikleri Depoya Isle (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Yalnızca playlist.m3u dosyasında değişiklik varsa commit at
          git add playlist.m3u
          if git diff --staged --quiet; then
            echo "Herhangi bir değişiklik yok."
          else
            git commit -m "Otomatik Guncelleme: playlist.m3u [skip ci]"
            git push
          fi
