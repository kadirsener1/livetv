name: Avva Sports Link Güncelle 2 saat

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Python Kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bağımlılık Kur
        run: pip install requests

      - name: Linkleri Güncelle ve M3U Yaz
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scrape_avvason.py

      - name: Playlist Dosyasını Git ile Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik playlist.m3u güncellemesi: $(date +'%Y-%m-%d %H:%M:%S')" && git push)

      # --- EKLENEN BİLGİLENDİRME VE ÖZET ADIMI ---
      - name: İşlem Özetini Oluştur ve Bilgilendir
        if: always() # İşlem başarsa da başarısız olsa da bilgilendirmeyi basar
        run: |
          echo "## 📊 Avva Sports Link Güncelleme Raporu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Çalışma Zamanı:** $(date +'%Y-%m-%d %H:%M:%S') (UTC)" >> $GITHUB_STEP_SUMMARY
          
          if [ -f playlist.m3u ]; then
            SATIR_SAYISI=$(wc -l < playlist.m3u)
            DOSYA_BOYUTU=$(du -h playlist.m3u | cut -f1)
            echo " - **Durum:** ✅ \`playlist.m3u\` başarıyla kontrol edildi/güncellendi." >> $GITHUB_STEP_SUMMARY
            echo " - **Dosya Boyutu:** $DOSYA_BOYUTU" >> $GITHUB_STEP_SUMMARY
            echo " - **Toplam Satır Sayısı:** $SATIR_SAYISI" >> $GITHUB_STEP_SUMMARY
          else
            echo " - **Durum:** ❌ \`tv247tr.m3u\` dosyası bulunamadı!" >> $GITHUB_STEP_SUMMARY
          fi
