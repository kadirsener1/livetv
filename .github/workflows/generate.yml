name: Generate Single M3U Playlist

on:
  # ⏰ Her 20 dakikada bir otomatik yeniler
  schedule:
    - cron: "*/20 * * * *"

  # 🖱️ GitHub panelinden manuel çalıştırma
  workflow_dispatch:

  # 📦 Kod güncellendiğinde tetikleme
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo'yu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ⚙️ Tek M3U Dosyasını Oluştur
        run: python generate_m3u.py

      - name: 📤 GitHub'a Kaydet (Commit & Push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/playlist.m3u
          if git diff --cached --quiet; then
            echo "ℹ️ Güncelleme yok, atlanıyor."
          else
            git commit -m "🔄 M3U Güncellendi [$(date -u +'%d.%m.%Y %H:%M UTC')]"
            git push
          fi
