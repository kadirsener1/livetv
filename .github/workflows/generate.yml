name: Generate M3U Playlist

on:
  # ⏰ Her 30 dakikada bir otomatik yeniler
  schedule:
    - cron: "*/30 * * * *"

  # 🖱️ Manuel başlatma butonu
  workflow_dispatch:

  # 📦 Kod güncellendiğinde çalıştır
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo'yu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ⚙️ M3U Oluştur
        run: python generate_m3u.py

      - name: 📤 GitHub'a Push Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/playlist.m3u
          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok, push atlandı."
          else
            git commit -m "🔄 M3U Güncellendi [$(date -u +'%d.%m.%Y %H:%M UTC')]"
            git push
          fi
