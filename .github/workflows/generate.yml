name: Generate M3U Playlist

on:
  # ⏰ Her 30 dakikada bir otomatik çalıştır
  schedule:
    - cron: "*/30 * * * *"

  # 🖱️ Manuel tetikleme butonu
  workflow_dispatch:

  # 📦 Push olduğunda da çalıştır (test için)
  push:
    branches: [main]
    paths:
      - "generate_m3u.py"
      - ".github/workflows/**"

# Aynı anda tek çalışma izin ver
concurrency:
  group: m3u-generate
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repo'yu çek
        uses: actions/checkout@v4

      - name: 🐍 Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Bağımlılıkları kur
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: ⚙️ M3U dosyasını oluştur
        env:
          SOURCE_URL: "https://livelive24.com/test/processed_matches_prioritized.json"
          OUTPUT_DIR: "output"
          OUTPUT_FILE: "playlist.m3u"
        run: python generate_m3u.py

      - name: 📤 Değişiklikleri commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok, commit atlanıyor."
          else
            git commit -m "🔄 M3U güncellendi $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 📊 Özet
        run: |
          echo "### ✅ M3U Oluşturuldu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Dosya:** \`output/playlist.m3u\`" >> $GITHUB_STEP_SUMMARY
          echo "**Zaman:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          if [ -f output/playlist.m3u ]; then
            LINES=$(grep -c "^#EXTINF" output/playlist.m3u || echo 0)
            echo "**Yayın sayısı:** $LINES" >> $GITHUB_STEP_SUMMARY
          fi
