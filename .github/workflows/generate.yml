name: Generate TV M3U Playlist

on:
  # ⏰ Her 30 dakikada bir otomatik günceller
  schedule:
    - cron: "*/30 * * * *"

  # 🖱️ Manuel olarak başlatmak için buton
  workflow_dispatch:

  # 📦 Kod güncellendiğinde otomatik çalıştır
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ⚙️ TV M3U Dosyasını Oluştur
        run: python generate_m3u.py

      - name: 📤 GitHub'a Kaydet ve Push Et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/tv.m3u
          if git diff --cached --quiet; then
            echo "ℹ️ Herhangi bir değişiklik yok, push atlandı."
          else
            git commit -m "🔄 TV M3U Güncellendi [$(date -u +'%d.%m.%Y %H:%M UTC')]"
            git push
          fi
