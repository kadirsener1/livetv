name: Generate NTV M3U Playlist

on:
  schedule:
    # ⏰ Her 30 dakikada bir otomatik günceller
    - cron: "*/30 * * * *"
  workflow_dispatch: # 🖱️ Manuel başlatma
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ⚙️ M3U Dosyasını Oluştur
        env:
          SOURCE_URL: "https://livelive24.com/test/ntv/ntv.json"
          OUTPUT_DIR: "output"
          OUTPUT_FILE: "playlist.m3u"
        run: python generate_m3u.py

      - name: 📤 GitHub'a Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/playlist.m3u
          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok, push atlandı."
          else
            git commit -m "🔄 NTV M3U Güncellendi [$(date -u +'%d.%m.%Y %H:%M UTC')]"
            git push
          fi
