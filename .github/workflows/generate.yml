name: Scrape Sports Streams

on:
  schedule:
    # ⏰ Her 30 dakikada bir otomatik günceller
    - cron: "*/30 * * * *"
  workflow_dispatch: # 🖱️ Manuel başlatma
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-sports:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Depoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Kütüphaneleri Kur
        run: |
          pip install --no-cache-dir requests urllib3

      - name: ⚽ Sadece Spor Yayınlarını Kazı ve M3U Yap
        env:
          SOURCE_URL: "https://livelive24.com/tv.json"
          OUTPUT_DIR: "output"
          OUTPUT_FILE: "sports.m3u"
        run: python generate_m3u.py

      - name: 📤 Değişiklikleri GitHub'a Gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/sports.m3u
          if git diff --cached --quiet; then
            echo "ℹ️ Değişiklik yok."
          else
            git commit -m "⚽ Spor Kanalları Güncellendi [$(date -u +'%d.%m.%Y %H:%M UTC')]"
            git push
          fi
