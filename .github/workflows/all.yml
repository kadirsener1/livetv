name: TÜM Linkleri Guncelle

on:
  workflow_dispatch: # Manuel tetikleme için
  schedule:
    - cron: '0 */2 * * *'  # Her 2 saatte bir otomatik çalışır

# Depoya yazma izni
permissions:
  contents: write

jobs:
  run-all-scrapers:
    runs-on: ubuntu-latest

    steps:
      # 1. Depoyu indir
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python ortamını hazırla
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Bağımlılıkları yükle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Playwright tarayıcılarını yükle
      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      # 5. Adım: tv247tr çalıştır
      - name: Run tv247tr Scraper
        run: |
          python tv247tr.py

      # 6. Adım: atom çalıştır
      - name: Run atom Scraper
        run: |
          python atom.py

      # 7. Adım: mahsun çalıştır
      - name: Run mahsun Scraper
        run: |
          python mahsun.py

      # 8. Adım: worldsport çalıştır
      - name: Run worldsport Scraper
        run: |
          python worldsport.py

      # 9. Tüm değişiklikleri kontrol et, commit ve push yap
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Oluşan tüm .m3u dosyalarını ve ilgili klasörleri ekle
          git add -A

          # Değişiklik kontrolü
          if git diff --cached --quiet; then
            echo "Herhangi bir değişiklik bulunamadı, push yapılmayacak."
          else
            git commit -m "Tum yayin listeleri ve m3u dosyalari guncellendi [skip ci]"
            git push
          fi
