name: Tüm Linkleri Guncelle

on:
  workflow_dispatch: # Manuel çalıştırmak için
  schedule:
    - cron: '0 */2 * * *'  # Her 2 saatte bir otomatik çalışır

permissions:
  contents: write

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      # 1. Depoyu çek
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python ortamını kur
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Bağımlılıkları yükle
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Tarayıcıyı kur
      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      # 5. Git kimlik bilgilerini ayarla
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # --- 1. TV247TR İŞLEMİ ---
      - name: Run tv247tr Scraper & Save
        continue-on-error: true
        run: |
          python tv247tr.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "tv247tr linkleri güncellendi [skip ci]"
            git push
          else
            echo "tv247tr için değişiklik yok."
          fi

      # --- 2. ATOM İŞLEMİ ---
      - name: Run atom Scraper & Save
        continue-on-error: true
        run: |
          python atom.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "atom linkleri güncellendi [skip ci]"
            git push
          else
            echo "atom için değişiklik yok."
          fi

      # --- 3. MAHSUN İŞLEMİ ---
      - name: Run mahsun Scraper & Save
        continue-on-error: true
        run: |
          python mahsun.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "mahsun linkleri güncellendi [skip ci]"
            git push
          else
            echo "mahsun için değişiklik yok."
          fi

      # --- 4. TV247WS İŞLEMİ ---
      - name: Run tv247ws Scraper & Save
        continue-on-error: true
        run: |
          python tv247ws.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "tv247ws linkleri güncellendi [skip ci]"
            git push
          else
            echo "tv247ws için değişiklik yok."
          fi
