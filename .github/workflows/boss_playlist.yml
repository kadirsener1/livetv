name: boss IPTV Playlist & Cache

on:
  schedule:
    # Her 30 dakikada bir otomatik çalıştır
    - cron: '*/30 * * * *'
  workflow_dispatch: # Elle tetikleme imkanı

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repoya yazma izni (commit/push için şart)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Run Scraper Script
        run: python scrape_boss.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          
          # playlist.m3u ve domain_cache.txt dosyalarını stage'e ekle
          git add playlist.m3u domain_cache.txt
          
          # Eğer dosyalarda değişiklik olduysa commit at ve push'la
          git diff --staged --quiet || git commit -m "Auto-update playlist and domain cache [skip ci]"
          git push
