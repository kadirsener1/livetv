name: Mahsun Update List

permissions:
  contents: write   # Push yapabilmesi için zorunlu yazma izni

on:
  schedule:
    - cron: '0 */3 * * *'   # Her gece 00:00'da otomatik çalışır
  workflow_dispatch:       # Manuel çalıştırma butonu

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Çakışmaları önlemek için geçmişi çeker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run script
        run: python tv.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Dosya adı tv247tr.m3u olarak ayarlandı
          git add tv247tr.m3u
          
          # Eğer linklerde değişiklik yapıldıysa commit ve push yapar
          if git diff --staged --quiet; then
            echo "Değişiklik yok, push işlemi atlandı."
          else
            git commit -m "Liste Güncellendi (tv247tr.m3u) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
